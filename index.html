  .links .label { flex: 1; overflow-wrap: anywhere; }
  .links .label { margin-right: 36px; }
  .links a.sorot { background: var(--aksen); color: var(--aksen-teks); border-color: var(--aksen); }
  footer { margin-top: 40px; font-size: 0.75rem; color: var(--sub); }
